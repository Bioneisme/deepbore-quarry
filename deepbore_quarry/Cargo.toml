[package]
name = "mod-deepbore_quarry"
version = "0.3.0"
edition = "2024"
license = "MIT"
publish = false
description = "Deepbore Quarry for Horizon: a machine that digs a square pit down to bedrock and fills a chest."

[dependencies]
# The pinned SDK's API crate, fetched into .horizon/sdk/ by any `cargo horizon-mod` command (the
# launcher builds against its own copy of the same build).
horizon-mod-api = { path = ".horizon/sdk/api/crates/horizon-mod-api" }
log = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
